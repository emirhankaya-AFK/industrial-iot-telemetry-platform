name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Start Mosquitto MQTT Broker Service
        run: |
          docker run -d --name mosquitto-ci -p 1883:1883 -v ${{ github.workspace }}/.github/mosquitto.conf:/mosquitto/config/mosquitto.conf eclipse-mosquitto:2.0
          sleep 2

      - name: Run Pytest Test Suite (Live Redis & MQTT)
        env:
          REDIS_URL: redis://localhost:6379/0
          MQTT_HOST: localhost
          MQTT_PORT: 1883
        run: |
          pytest tests/ -v

      - name: Run Streaming Anomaly Benchmark (Live Redis Streams)
        env:
          REDIS_URL: redis://localhost:6379/0
          MQTT_HOST: localhost
          MQTT_PORT: 1883
        run: |
          python tests/evaluation/run_benchmark.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: industrial-iot-api:latest

      - name: Build Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          tags: industrial-iot-dashboard:latest
